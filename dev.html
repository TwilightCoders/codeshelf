<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="node_modules/@vscode/codicons/dist/codicon.css">
  <link rel="stylesheet" href="media/styles/main.css">
  <title>CodeShelf Dev</title>
  <style>
    /* Mock VS Code theme variables for browser preview */
    :root {
      --vscode-editor-background: #1e1e1e;
      --vscode-editor-foreground: #cccccc;
      --vscode-sideBar-background: #252526;
      --vscode-sideBar-foreground: #cccccc;
      --vscode-input-background: #3c3c3c;
      --vscode-input-foreground: #cccccc;
      --vscode-input-border: #3c3c3c;
      --vscode-input-placeholderForeground: #717171;
      --vscode-button-background: #0e639c;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #1177bb;
      --vscode-focusBorder: #007fd4;
      --vscode-descriptionForeground: #969696;
      --vscode-panel-border: rgba(255,255,255,0.08);
      --vscode-badge-background: #4d4d4d;
      --vscode-badge-foreground: #cccccc;
      --vscode-list-hoverBackground: #2a2d2e;
      --vscode-toolbar-hoverBackground: rgba(90,93,94,0.31);
      --vscode-textLink-foreground: #3794ff;
      --vscode-menu-background: #252526;
      --vscode-menu-foreground: #cccccc;
      --vscode-menu-selectionBackground: #04395e;
      --vscode-menu-border: #454545;
      --vscode-errorForeground: #f44;
      --vscode-font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      --vscode-font-size: 13px;
      --vscode-editor-font-family: 'SF Mono', Menlo, Monaco, monospace;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // ── Mock Extension Host ──
    // Simulates the real extension host message protocol so browser tests
    // can verify round-trip state changes (star, hide, scan, etc.)

    (function() {
      var shelves = null;
      var booksetThreshold = 8;

      // ── Mock Shelf Data ──

      function createMockShelves() {
        return [
          {
            name: 'Apps', path: '/mock/code/Apps', rootLabel: 'Code', rootPath: '/mock/code',
            items: [
              { kind: 'project', project: { name: 'Harbor', path: '/mock/code/Apps/Harbor', markers: ['.git', '*.xcodeproj'], primaryLanguage: 'swift', gitBranch: 'master', lastModified: Date.now() - 86400000 } },
              { kind: 'project', project: { name: 'Snooze', path: '/mock/code/Apps/Snooze', markers: ['.git', '*.xcodeproj'], primaryLanguage: 'swift', gitBranch: 'main', lastModified: Date.now() - 86400000 * 3 } },
            ],
          },
          {
            name: 'Gems', path: '/mock/code/Gems', rootLabel: 'Code', rootPath: '/mock/code',
            items: [
              { kind: 'project', project: { name: 'glossary', path: '/mock/code/Gems/glossary', markers: ['.git', '*.gemspec'], primaryLanguage: 'ruby', gitBranch: 'main', lastModified: Date.now() - 86400000 * 2, starred: true } },
              { kind: 'project', project: { name: 'task_queue-redis', path: '/mock/code/Gems/task_queue-redis', markers: ['.git', '*.gemspec'], primaryLanguage: 'ruby', gitBranch: 'overhaul', lastModified: Date.now() - 86400000 * 30 } },
              { kind: 'project', project: { name: 'radio-client', path: '/mock/code/Gems/radio-client', markers: ['.git', '*.gemspec'], primaryLanguage: 'ruby', gitBranch: 'main', lastModified: Date.now() - 86400000 * 180 } },
              { kind: 'project', project: { name: 'created_at', path: '/mock/code/Gems/created_at', markers: ['.git', '*.gemspec'], primaryLanguage: 'ruby', gitBranch: 'main', lastModified: Date.now() - 86400000 * 365 } },
            ],
          },
          {
            name: 'vscode', path: '/mock/code/vscode', rootLabel: 'Code', rootPath: '/mock/code',
            items: [
              { kind: 'project', project: { name: 'termkit', path: '/mock/code/vscode/termkit', markers: ['.git', 'package.json'], primaryLanguage: 'javascript', gitBranch: 'main', lastModified: Date.now() - 3600000 } },
              { kind: 'project', project: { name: 'startpage', path: '/mock/code/vscode/startpage', markers: ['.git', 'package.json'], primaryLanguage: 'javascript', gitBranch: 'react-migration', lastModified: Date.now() - 600000, workspaceFile: '/mock/code/vscode/startpage/startpage.code-workspace' } },
            ],
          },
          {
            name: 'Other', path: '/mock/Workspace/Other', rootLabel: 'Workspace', rootPath: '/mock/Workspace',
            items: [
              { kind: 'project', project: { name: 'flock', path: '/mock/Workspace/Other/flock', markers: ['.git', 'Makefile'], primaryLanguage: 'make', gitBranch: 'master', lastModified: Date.now() - 86400000 * 7 } },
              { kind: 'project', project: { name: 'xterm-link-provider', path: '/mock/Workspace/Other/xterm-link-provider', markers: ['.git', 'package.json'], primaryLanguage: 'javascript', gitBranch: 'fix-indexOf', lastModified: Date.now() - 86400000 * 14 } },
            ],
          },
          {
            name: 'Archive', path: '/mock/Workspace/Archive', rootLabel: 'Workspace', rootPath: '/mock/Workspace', hidden: true,
            items: [
              { kind: 'project', project: { name: 'old-project', path: '/mock/Workspace/Archive/old-project', markers: ['.git'], gitBranch: 'master', lastModified: Date.now() - 86400000 * 400 } },
            ],
          },
        ];
      }

      // ── Deep Clone ──

      function clone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      // ── Project/Shelf Finders ──

      function forEachProject(cb) {
        for (var s = 0; s < shelves.length; s++) {
          var shelf = shelves[s];
          for (var i = 0; i < shelf.items.length; i++) {
            var item = shelf.items[i];
            if (item.kind === 'project') {
              cb(item.project, shelf);
            } else if (item.kind === 'bookset') {
              for (var j = 0; j < item.projects.length; j++) {
                cb(item.projects[j], shelf);
              }
            }
          }
        }
      }

      function findShelf(path) {
        for (var s = 0; s < shelves.length; s++) {
          if (shelves[s].path === path) return shelves[s];
        }
        return null;
      }

      // ── Message Handler (simulates real extension host) ──

      function handleMessage(msg) {
        console.log('[postMessage]', msg.type, JSON.stringify(msg));

        switch (msg.type) {
          case 'ready':
            shelves = createMockShelves();
            setTimeout(function() {
              window.postMessage({ type: 'settings:state', hasRoots: true, booksetThreshold: booksetThreshold }, '*');
            }, 50);
            setTimeout(function() {
              window.postMessage({ type: 'projects:loaded', shelves: clone(shelves) }, '*');
            }, 150);
            break;

          case 'item:star': {
            // Toggle star on project or shelf
            var found = false;
            forEachProject(function(project) {
              if (project.path === msg.path) {
                project.starred = msg.starred;
                found = true;
              }
            });
            if (!found) {
              var shelf = findShelf(msg.path);
              if (shelf) shelf.starred = msg.starred;
            }
            // Re-send shelves (simulates scan() after updateItemMeta)
            setTimeout(function() {
              window.postMessage({ type: 'projects:loaded', shelves: clone(shelves) }, '*');
            }, 50);
            break;
          }

          case 'item:hide': {
            // Hide a shelf or project
            var hiddenProject = false;
            forEachProject(function(project, parentShelf) {
              if (project.path === msg.path) {
                // Remove project from its shelf (real ext hides via metadata, but for mock we remove)
                for (var i = 0; i < parentShelf.items.length; i++) {
                  var item = parentShelf.items[i];
                  if (item.kind === 'project' && item.project.path === msg.path) {
                    parentShelf.items.splice(i, 1);
                    hiddenProject = true;
                    break;
                  } else if (item.kind === 'bookset') {
                    for (var j = 0; j < item.projects.length; j++) {
                      if (item.projects[j].path === msg.path) {
                        item.projects.splice(j, 1);
                        hiddenProject = true;
                        break;
                      }
                    }
                    if (hiddenProject) break;
                  }
                }
              }
            });
            if (!hiddenProject) {
              var hideShelf = findShelf(msg.path);
              if (hideShelf) hideShelf.hidden = msg.hidden;
            }
            setTimeout(function() {
              window.postMessage({ type: 'projects:loaded', shelves: clone(shelves) }, '*');
            }, 50);
            break;
          }

          case 'projects:requestScan':
            // Just re-send current shelves
            window.postMessage({ type: 'projects:scanning', scanning: true }, '*');
            setTimeout(function() {
              window.postMessage({ type: 'projects:scanning', scanning: false }, '*');
              window.postMessage({ type: 'projects:loaded', shelves: clone(shelves), diff: { added: 0, removed: 0, changed: false, addedPaths: [] } }, '*');
            }, 100);
            break;

          case 'poster:generate':
            // Simulate generating a poster
            window.postMessage({ type: 'poster:generating', projectPath: msg.projectPath }, '*');
            setTimeout(function() {
              var svg = '<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"><rect width="400" height="240" fill="#2d2d3d"/><text x="200" y="130" text-anchor="middle" font-size="24" fill="#ccc">Mock Poster</text></svg>';
              // Also update the project in shelves
              forEachProject(function(project) {
                if (project.path === msg.projectPath) {
                  project.poster = svg;
                }
              });
              window.postMessage({ type: 'poster:loaded', projectPath: msg.projectPath, posterUri: svg }, '*');
            }, 500);
            break;

          case 'poster:cancel':
            // Clear forge animation
            window.postMessage({ type: 'poster:loaded', projectPath: msg.projectPath, posterUri: '' }, '*');
            break;

          // These don't need responses in the mock
          case 'project:open':
          case 'folder:reveal':
          case 'settings:openJson':
          case 'settings:pickRoot':
          case 'settings:addRoot':
          case 'poster:attach':
          case 'item:editMeta':
            break;
        }
      }

      // ── Mock VS Code API ──

      window.acquireVsCodeApi = function() {
        return {
          postMessage: handleMessage,
          getState: function() { return null; },
          setState: function(state) { console.log('[setState]', state); },
        };
      };

      // ── Test Helpers (accessible from puppeteer evaluate) ──

      window.__mockHost = {
        getShelves: function() { return clone(shelves); },
        resetShelves: function() { shelves = createMockShelves(); },
        injectShelves: function(newShelves) {
          shelves = newShelves;
          window.postMessage({ type: 'projects:loaded', shelves: clone(shelves) }, '*');
        },
        /** Add a new project to a shelf and send with addedPaths to trigger sparkle */
        addProject: function(shelfName, project) {
          for (var s = 0; s < shelves.length; s++) {
            if (shelves[s].name === shelfName) {
              shelves[s].items.push({ kind: 'project', project: project });
              window.postMessage({
                type: 'projects:loaded',
                shelves: clone(shelves),
                diff: { added: 1, removed: 0, changed: true, addedPaths: [project.path] },
              }, '*');
              return;
            }
          }
        },
      };
    })();
  </script>
  <script src="out-webview/webview/main.js"></script>
</body>
</html>
